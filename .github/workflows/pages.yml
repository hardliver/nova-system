# 部署網頁版 Nova 到 GitHub Pages：https://hardliver.github.io/nova-system
#
# 每次 push 到 main（或在 Actions 頁面按「Run workflow」）：
#   1. 把 nova-system、comet、wildkin 三個 repo 放在同一層（和本機 ~/projects/nova 一樣）
#   2. 安裝 emscripten、Node.js
#   3. make web：編譯引擎、合併系統卡匣和 Wildkin，產生 build/web/
#   4. 把 build/web/ 發布到 GitHub Pages
#   5. 如果 push 的是版本標籤（例如 v0.1.0）：建立 GitHub Release，附上本機架站用的 nova-web.zip
#
# 發布新版本：git tag v0.1.0 && git push origin v0.1.0
#
# 第一次使用前：repo 的 Settings → Pages → Source 選「GitHub Actions」。
# comet、wildkin 改了以後，網頁版不會自動更新：到這裡的 Actions 頁面手動 Run workflow。

name: Deploy web Nova

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write     # 建立 Release 要用

  pages: write
  id-token: write

# 同時只跑一個部署；新的來了，舊的還沒部署完就取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nova-system
      - uses: actions/checkout@v4
        with:
          repository: hardliver/comet-engine
          path: comet
      - uses: actions/checkout@v4
        with:
          repository: hardliver/wildkin
          path: wildkin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 和本機（brew 的 emscripten 6.0.12）同一個版本，編出來的 wasm 才和本機一樣
      - name: Install emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 6.0.12
          ./emsdk activate 6.0.12
          # 之後的步驟也要找得到 emcc：只把 emcc 所在的資料夾加進 PATH。
          # 不能加 emsdk 本身的資料夾：裡面有一個叫 node 的「資料夾」，
          # 會擋在真正的 node 前面，make 執行 node 時就變成「Permission denied」
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      # 分成幾步：哪一步失敗，在 Actions 頁面一眼就看得出來
      - name: Check emcc
        run: emcc --version

      # make 失敗時，把最後 20 行輸出變成 Actions 頁面上的錯誤標記（annotations），
      # 不用點開日誌就看得到錯在哪
      - name: Build engine (comet)
        run: nova-system/.github/run-and-report.sh make -C comet web

      # zip 會先做 web，所以這一步同時產生 build/web/ 和 build/nova-web.zip
      - name: Build web Nova
        run: nova-system/.github/run-and-report.sh make -C nova-system zip

      - name: Release (only for version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nova-system/build/nova-web.zip \
            --repo "$GITHUB_REPOSITORY" --title "Nova $GITHUB_REF_NAME" --generate-notes

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nova-system/build/web

  # 只有 main 才部署網頁版（GitHub Pages 預設不允許從標籤部署）
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
